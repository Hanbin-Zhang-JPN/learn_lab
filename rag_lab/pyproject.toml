[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-lab"
version = "0.1.0"
description = "中身を追える、標準ライブラリだけの日本語 RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
raglab = "raglab.cli:main"

[tool.setuptools.packages.find]
include = ["raglab*"]
